<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: zone-a-ramp-left.png</title>
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8e8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-wordmark region chrome" data-region="wordmark"><!-- Wordmark, Archivo condensed caps in near-black on bone ground. --></div>
  <div class="r-wordmark-sub region text" data-region="wordmark-sub"><!-- Role line, tracked legend caps beneath the wordmark. --><p style="line-height:1.05;margin:0">wordmark-sub</p></div>
  <div class="r-nav region control" data-region="nav"><!-- Primary navigation, tracked legend caps, no underline rule.: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav); a control need not have button chrome --></div>
  <div class="r-gauge-bar region chrome" data-region="gauge-bar"><!-- Eleven-cell complexity gauge on a true 0-to-X ramp (near-paper at 0, black at X), inked from the base to the declared level; cells above the level stay empty. CSS only. --></div>
  <div class="r-gauge-caption region text" data-region="gauge-caption"><!-- Gauge title block: hairline above, COMPLEXITY legend, level readout, declared-scale note. --><p style="line-height:1.05;margin:0">gauge-caption</p></div>
  <div class="r-gauge-level region text" data-region="gauge-level"><!-- Level readout: COMPLEXITY legend against the roman level over ten. --><p style="line-height:1.05;margin:0">gauge-level</p></div>
  <div class="r-positioning-label region text" data-region="positioning-label"><!-- Section legend marking the positioning statement. --><p style="line-height:1.05;margin:0">positioning-label</p></div>
  <div class="r-headline region text" data-region="headline"><!-- Archivo variable, condensed caps at plan scale. --><p style="line-height:1.05;margin:0">headline</p></div>
  <div class="r-subcopy region text" data-region="subcopy"><!-- Supporting line, Plex Mono on cleared ground. --><p style="line-height:1.05;margin:0">subcopy</p></div>
  <div class="r-cta region control" data-region="cta"><!-- Primary control: solid near-black bar, legend caps, closed by a hatched chip.: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cta); a control need not have button chrome --></div>
  <div class="r-cta-chip region chrome" data-region="cta-chip"><!-- Hatched delta chip closing the primary control. --></div>
  <div class="r-notation-key region chrome" data-region="notation-key"><!-- Three-mark legend: constraint, measured outcome, not yet measured. --></div>
  <div class="r-spec-block region chrome" data-region="spec-block"><!-- Specification table: ROLE, STATUS, LOCATION in legend caps against mono values, hairline rules sized to the content. --></div>
  <div class="r-record-sheet region chrome" data-region="record-sheet"><!-- Work record sheet, bone ground inside a hairline border, set slightly askew over the field with a soft drop shadow. --></div>
  <div class="r-record-header region chrome" data-region="record-header"><!-- Record sheet header strip: SELECTED WORK legend and sheet number, hairline below. --></div>
  <div class="r-record-title region text" data-region="record-title"><!-- Project name in Archivo condensed caps. --><p style="line-height:1.05;margin:0">record-title</p></div>
  <div class="r-constraint-label region text" data-region="constraint-label"><!-- Legend naming the constraint field. --><p style="line-height:1.05;margin:0">constraint-label</p></div>
  <div class="r-constraint-mark region chrome" data-region="constraint-mark"><!-- Crossed-hatch conflict mark. CSS repeating-linear-gradient, not a raster. --></div>
  <div class="r-constraint-value region text" data-region="constraint-value"><!-- Constraint text in Plex Mono, set beside the conflict mark. --><p style="line-height:1.05;margin:0">constraint-value</p></div>
  <div class="r-decision-label region text" data-region="decision-label"><!-- Legend naming the decision field. --><p style="line-height:1.05;margin:0">decision-label</p></div>
  <div class="r-decision-value region text" data-region="decision-value"><!-- Decision text in Plex Mono. --><p style="line-height:1.05;margin:0">decision-value</p></div>
  <div class="r-outcome-label region text" data-region="outcome-label"><!-- Legend naming the measured quantity for the outcome below. --><p style="line-height:1.05;margin:0">outcome-label</p></div>
  <div class="r-outcome-delta region text" data-region="outcome-delta"><!-- Plex Mono 600, the largest numeral on the page. --><p style="line-height:1.05;margin:0">outcome-delta</p></div>
  <div class="r-outcome-band region chrome" data-region="outcome-band"><!-- 45-degree magenta hatch band. CSS gradient; magenta is reserved for this and nothing else. --></div>
  <div class="r-record-foot region text" data-region="record-foot"><!-- Record sheet footer: role legend and year, hairline above. --><p style="line-height:1.05;margin:0">record-foot</p></div>
</main>
</body>
</html>
